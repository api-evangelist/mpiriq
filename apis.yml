aid: mpiriq
name: MPIRIQ
description: >-
  MPIRIQ (MPiriQ Science Technologies GmbH) is a Munich-based healthcare software
  company that automates clinical documentation for medical practices and study
  centers. Its AI platform structures patient data directly inside existing
  EMR/PMS systems, runs quality and billing validation checks in the background,
  and connects real-world care data to clinical research through decentralized,
  GDPR-compliant pseudonymization. The platform helps practices participate in
  clinical trials via automated indication screening and patient recruitment,
  giving physicians time back while opening a research revenue stream. Founded in
  2024 and backed by HV Capital and Speedinvest.
